<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <title>Apps Úteis</title>

  <!-- CSS global + header + apps -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/apps.css">
</head>
<body class="apps-page">

  <!-- CONTEÚDO DA PÁGINA DE APPS -->
  <main>
    <h1 class="page-title">Apps Úteis</h1>
    <p class="apps-intro">Selecione uma categoria para filtrar os aplicativos recomendados para sua viagem.</p>

    <div class="apps-categories">
      <button class="category-btn active" data-category="Todos">Todos</button>
      <button class="category-btn" data-category="Alimentação">Alimentação</button>
      <button class="category-btn" data-category="Transporte">Transporte</button>
    </div>

    <h2 id="categoria-atual" class="categoria-atual">Todos os apps</h2>

    <div class="apps-container">
      <!-- Os cards serão gerados dinamicamente pelo apps.js -->
    </div>
  </main>

  <!-- JS do header -->
  <script src="../js/header.js"></script>
  <!-- JS da página de apps -->
  <script src="../js/apps.js"></script>
</body>
</html>
